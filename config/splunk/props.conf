# =============================================
# Splunk Props - Parsing Configuration
# =============================================

[WinEventLog:ForensicUpload]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 30
TRUNCATE = 999999
KV_MODE = json
CHARSET = UTF-8
category = Custom
description = Forensic EVTX events uploaded via Forensic Uploader

[source::.../*.evtx.json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
KV_MODE = json
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
