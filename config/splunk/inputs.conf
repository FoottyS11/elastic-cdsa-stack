# =============================================
# Splunk Inputs - Forensic EVTX Monitoring
# =============================================

[default]
host = splunk-cdsa

# Monitor du dossier d'upload partagé pour les EVTX convertis en XML
[monitor:///opt/splunk-ingest/evtx]
disabled = false
sourcetype = WinEventLog:ForensicUpload
index = forensic_evtx
recursive = true
followSymlink = true
crcSalt = <SOURCE>

# Monitor pour les JSON bruts envoyés par la webapp
[monitor:///opt/splunk-ingest/json]
disabled = false
sourcetype = _json
index = forensic_json
recursive = true
followSymlink = true
crcSalt = <SOURCE>

# HEC (HTTP Event Collector) - configuré via default.yml
[http]
disabled = false
