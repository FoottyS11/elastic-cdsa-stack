# =============================================
# Splunk Custom Indexes for Forensics
# =============================================

[forensic_evtx]
homePath   = $SPLUNK_DB/forensic_evtx/db
coldPath   = $SPLUNK_DB/forensic_evtx/colddb
thawedPath = $SPLUNK_DB/forensic_evtx/thaweddb
maxTotalDataSizeMB = 10240
frozenTimePeriodInSecs = 2592000

[forensic_json]
homePath   = $SPLUNK_DB/forensic_json/db
coldPath   = $SPLUNK_DB/forensic_json/colddb
thawedPath = $SPLUNK_DB/forensic_json/thaweddb
maxTotalDataSizeMB = 5120
frozenTimePeriodInSecs = 2592000

[forensic_syslog]
homePath   = $SPLUNK_DB/forensic_syslog/db
coldPath   = $SPLUNK_DB/forensic_syslog/colddb
thawedPath = $SPLUNK_DB/forensic_syslog/thaweddb
maxTotalDataSizeMB = 5120
frozenTimePeriodInSecs = 2592000
