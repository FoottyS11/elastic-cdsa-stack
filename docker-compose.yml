services:
  # =============================================
  # ELASTICSEARCH (No Security)
  # =============================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: elasticsearch
    environment:
      - node.name=es-node-01
      - cluster.name=elastic-cdsa-lab
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - elastic-net
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # KIBANA (No Security)
  # =============================================
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: kibana
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - elastic-net
    depends_on:
      elasticsearch:
        condition: service_healthy

  # =============================================
  # LOGSTASH (No Security)
  # =============================================
  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION}
    container_name: logstash
    command: logstash -f /usr/share/logstash/pipeline/logstash.conf
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - XPACK_MONITORING_ENABLED=false
    volumes:
      - ./config/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - logstash-data:/usr/share/logstash/data
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
    networks:
      - elastic-net
    depends_on:
      elasticsearch:
        condition: service_healthy

  # =============================================
  # FORENSIC UPLOADER (Web Interface)
  # =============================================
  webapp:
    build: ./webapp
    container_name: forensic-uploader
    environment:
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5000
      - SPLUNK_HEC_URL=http://splunk:8088
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN}
    volumes:
      - ./uploads:/app/uploads
      - splunk-ingest:/app/splunk-ingest
    ports:
      - "8080:8080"
    networks:
      - elastic-net
    depends_on:
      - logstash
      - splunk

  # =============================================
  # SPLUNK (Forensic Analysis - Free License, No Auth)
  # =============================================
  splunk:
    image: splunk/splunk:9.1.2
    container_name: splunk-cdsa
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD}
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN}
      - SPLUNK_LICENSE_URI=Free
    volumes:
      - splunk-var:/opt/splunk/var
      - splunk-etc:/opt/splunk/etc
      - splunk-ingest:/opt/splunk-ingest
      - ./config/splunk/default.yml:/tmp/defaults/default.yml
      - ./config/splunk/inputs.conf:/opt/splunk/etc/system/local/inputs.conf
      - ./config/splunk/props.conf:/opt/splunk/etc/system/local/props.conf
      - ./config/splunk/indexes.conf:/opt/splunk/etc/system/local/indexes.conf
    ports:
      - "8000:8000"
      - "8088:8088"
    networks:
      - elastic-net
    healthcheck:
      test: [ "CMD", "curl", "-s", "-f", "http://localhost:8000" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  elasticsearch-data:
  logstash-data:
  splunk-var:
  splunk-etc:
  splunk-ingest:


networks:
  elastic-net:
    driver: bridge
